<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Download Accelerator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #050505; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #0a0a0a; border: 2px solid #64748b; border-radius: 16px; padding: 32px; width: 100%; max-width: 650px; box-shadow: 0 0 15px rgba(148, 163, 184, 0.2); transition: all 0.3s; }
        .card:hover { border-color: #cbd5e1; box-shadow: 0 0 25px rgba(203, 213, 225, 0.4); }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 24px; color: #f1f5f9; margin-bottom: 8px; }
        .header p { color: #94a3b8; font-size: 14px; }
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #475569; background-color: #121212; color: #fff; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #94a3b8; }
        button { padding: 14px; border: 1px solid #94a3b8; border-radius: 8px; background: linear-gradient(135deg, #334155, #0f172a); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        button:hover { background: linear-gradient(135deg, #475569, #1e293b); border-color: #f1f5f9; }
        button:disabled { background: #1e293b; border-color: #334155; color: #64748b; cursor: not-allowed; }
        .status-box { background-color: #121212; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: none; }
        .progress-bar-bg { width: 100%; height: 12px; background-color: #1e293b; border-radius: 6px; overflow: hidden; margin-bottom: 16px; border: 1px solid #334155; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #64748b, #f1f5f9); transition: width 0.2s; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 14px; }
        .stat-item { background-color: #0a0a0a; border: 1px solid #334155; padding: 10px; border-radius: 6px; text-align: center; }
        .stat-value { font-weight: bold; color: #e2e8f0; font-size: 16px; margin-top: 4px; }
        .log { margin-top: 16px; font-size: 12px; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>🚀 Turbo Accelerator</h1>
        <p>مسرع التحميل واختبار السحب الفائق</p>
    </div>

    <div class="input-group">
        <input type="text" id="fileUrl" placeholder="أدخل رابط التحميل هنا...">
        <button id="downloadBtn" onclick="startTurboDownload()">بدء التحميل الصاروخي</button>
    </div>

    <div class="status-box" id="statusBox">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">السرعة الحالية<div class="stat-value" id="speed">0 MB/s</div></div>
            <div class="stat-item">نسبة الإنجاز<div class="stat-value" id="percent">0%</div></div>
            <div class="stat-item">المحمل / الاجمالي<div class="stat-value" id="downloaded">0 / 0 MB</div></div>
            <div class="stat-item">الوقت المتبقي<div class="stat-value" id="eta">--:--</div></div>
        </div>

        <div class="log" id="statusLog">جاري الاتصال وسحب الملف...</div>
    </div>
</div>

<script>
    async function startTurboDownload() {
        const rawUrl = document.getElementById('fileUrl').value.trim();
        const btn = document.getElementById('downloadBtn');
        const statusBox = document.getElementById('statusBox');
        
        if (!rawUrl) {
            alert('يرجى إدخال رابط أولاً!');
            return;
        }

        btn.disabled = true;
        statusBox.style.display = 'block';
        updateLog('جاري الاتصال عبر البروكسي لتجاوز الحظر وتجربة السرعة...');

        // استخدام بروكسي لتسهيل التجربة بدون أخطاء CORS
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(rawUrl);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('فشل الاتصال بالسيرفر');

            const contentLength = response.headers.get('content-length') || 10485760; // افتراضي 10MB للتجربة
            const totalBytes = parseInt(contentLength, 10);

            const reader = response.body.getReader();
            let loadedBytes = 0;
            let lastLoaded = 0;
            const chunks = [];

            const speedInterval = setInterval(() => {
                const speedBytesPerSec = loadedBytes - lastLoaded;
                lastLoaded = loadedBytes;

                const speedMB = (speedBytesPerSec / (1024 * 1024)).toFixed(2);
                document.getElementById('speed').innerText = `${speedMB} MB/s`;

                const percent = Math.min(((loadedBytes / totalBytes) * 100), 100).toFixed(1);
                document.getElementById('percent').innerText = `${percent}%`;
                document.getElementById('progressFill').style.width = `${percent}%`;

                document.getElementById('downloaded').innerText = `${(loadedBytes / (1024 * 1024)).toFixed(1)} MB`;
            }, 1000);

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loadedBytes += value.length;
            }

            clearInterval(speedInterval);

            updateLog('جاري حفظ الملف على جهازك...');
            const finalBlob = new Blob(chunks);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(finalBlob);
            a.download = "turbo_test_file";
            document.body.appendChild(a);
            a.click();
            a.remove();

            updateLog('✅ اكتمل التحميل واختبار الموقع بنجاح!');
            document.getElementById('percent').innerText = '100%';
            document.getElementById('progressFill').style.width = '100%';

        } catch (err) {
            console.error(err);
            updateLog('❌ حدث خطأ، تأكد من صحة الرابط.');
        } finally {
            btn.disabled = false;
        }
    }

    function updateLog(msg) {
        document.getElementById('statusLog').innerText = msg;
    }
</script>

</body>
</html>
